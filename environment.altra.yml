name: taiji-agent-altra
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python + packages needed by build/run scripts
  - python>=3.10
  - openpyxl>=3.1
  - pyyaml>=6.0
  - click>=8.0
  - pandas>=2.0
  # Tools Taiji calls at runtime (must be in PATH for SLURM tasks)
  - macs2>=2.2          # Taiji calls `macs2 callpeak` internally for ATAC peak calling
  - ucsc-bedgraphtobigwig  # Taiji calls `bedGraphToBigWig` for ATAC visualization tracks
  # Utilities for fragment file handling
  - htslib>=1.17        # provides bgzip and tabix for .bed.gz indexing
