# Runtime dependencies for the detect-dataset-type skill.
# Read by bin/doctor.sh to verify the install before a run.

skill: detect-dataset-type
purpose: Classify a directory as bulk / single-cell / mixed / unknown.

binaries: []           # Pure-Python skill; no external binaries needed.

python_packages:
  - {name: python, min_version: "3.10"}

r_packages: []         # No R involved.

data: []               # Reads file extensions and names only.

notes: |
  This skill is intentionally dependency-light: it does extension matching and
  filename-pattern detection on a directory tree, no file content is opened.
  If `which python3` works and the script is in scripts/detect.py, the skill
  will run.
