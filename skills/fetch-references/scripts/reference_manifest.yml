# reference_manifest.yml — declarative spec of the reference data the
# Taiji-agent pipeline needs per genome. Read by fetch.py.
#
# For each genome:
#   - fasta:          primary-assembly genome FASTA (gunzipped on disk)
#   - gtf:            GENCODE annotation (gunzipped on disk)
#   - motif_cisbp:    CIS-BP MEME motif file. VENDORED in this repo at
#                     cisbp_database/ so no external download is needed.
#                     CIS-BP aggregates JASPAR + TRANSFAC + ENCODE +
#                     SELEX-seq + PBMs and keys motifs by TF gene symbol
#                     as the primary ID, so Taiji's GeneRanks output is
#                     gene-name-interpretable.
#                     - Human:  cisbp_human_2.meme (4443 PWMs, full CIS-BP)
#                       — verified to match the reference Nextflow run
#                       on the RA/OA hg38 chr22 dataset (Spearman 0.97,
#                       RMSE ~4e-5).
#                     - Mouse:  cisBP_mouse.meme
#   - build_fai (optional flag on fasta): run samtools faidx after download
#
# CIS-BP is the only supported motif source. HOCOMOCO support was removed
# after verification showed it produces materially different output from
# the reference run.
#
# Sources:
#   - GENCODE FASTA + GTF via EMBL-EBI mirror (release-versioned, immutable)
#   - CIS-BP MEME files vendored under cisbp_database/ (no network)
#
# Vendored entries declare `vendored_path` (relative to repo root) and are
# copied into <output_dir>/<genome>/<target> at fetch time — no network.
#
# Targets are written under <output_dir>/<genome>/<file>.

hg38:
  description: "Human GRCh38 + GENCODE v45 + CIS-BP (cisbp_human_2.meme, 4443 PWMs)"
  files:
    fasta:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/GRCh38.primary_assembly.genome.fa.gz
      target: hg38/genome.fa
      gunzip: true
      approx_size_mb: 3000
      build_fai: true
    gtf:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/gencode.v45.annotation.gtf.gz
      target: hg38/genes.gtf
      gunzip: true
      approx_size_mb: 1500
    motif_cisbp:
      vendored_path: cisbp_database/cisbp_human_2.meme
      target: hg38/cisbp_human_2.meme
      gunzip: false
      approx_size_mb: 3.5

hg19:
  description: "Human GRCh37 + GENCODE v19 (frozen) + CIS-BP (cisbp_human_2.meme, 4443 PWMs)"
  files:
    fasta:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_19/GRCh37.p13.genome.fa.gz
      target: hg19/genome.fa
      gunzip: true
      approx_size_mb: 3000
      build_fai: true
    gtf:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_19/gencode.v19.annotation.gtf.gz
      target: hg19/genes.gtf
      gunzip: true
      approx_size_mb: 1300
    motif_cisbp:
      vendored_path: cisbp_database/cisbp_human_2.meme
      target: hg19/cisbp_human_2.meme
      gunzip: false
      approx_size_mb: 3.5

mm10:
  description: "Mouse GRCm38 + GENCODE M25 (last on GRCm38) + CIS-BP"
  files:
    fasta:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/GRCm38.primary_assembly.genome.fa.gz
      target: mm10/genome.fa
      gunzip: true
      approx_size_mb: 2700
      build_fai: true
    gtf:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M25/gencode.vM25.annotation.gtf.gz
      target: mm10/genes.gtf
      gunzip: true
      approx_size_mb: 900
    motif_cisbp:
      vendored_path: cisbp_database/cisBP_mouse.meme
      target: mm10/cisBP_mouse.meme
      gunzip: false
      approx_size_mb: 0.7
