# reference_manifest.yml — declarative spec of the reference data the
# Taiji-agent pipeline needs per genome. Read by fetch.py.
#
# For each genome:
#   - fasta:           primary-assembly genome FASTA (gunzipped on disk)
#   - gtf:             GENCODE annotation (gunzipped on disk)
#   - motif_cisbp:     CIS-BP v2.00 MEME motif file (DEFAULT). Extracted
#                      from the MEME Suite motif-database tarball. CIS-BP
#                      aggregates JASPAR + TRANSFAC + ENCODE + SELEX-seq +
#                      PBMs and re-keys all motifs by TF gene symbol — so
#                      Taiji's GeneRanks output stays gene-name interpretable.
#   - motif_hocomoco:  HOCOMOCO v11 MEME motif file (alternative, opt-in
#                      via --motif-source hocomoco). Single source, slightly
#                      narrower TF coverage but immutable URL.
#   - build_fai (optional flag on fasta): run samtools faidx after download
#
# fetch.py picks ONE motif source per run via --motif-source (default cisbp)
# and creates a stable <genome>/motifs.meme symlink that Taiji templates
# reference, so switching motif sources doesn't require template edits.
#
# All URLs are from stable, long-lived hosts:
#   - GENCODE FASTA + GTF via EMBL-EBI mirror (release-versioned, immutable)
#   - CIS-BP via MEME Suite's motif-database tarball (versioned, ~30 MB)
#   - HOCOMOCO v11 from autosome.org (the canonical host since 2018)
#
# Tarball entries declare `extract_from_tar` (path inside the .tgz) and the
# downloader caches the tarball under <output_dir>/_cache/ so fetching
# multiple genomes only downloads it once.
#
# Targets are written under <output_dir>/<genome>/<file>.

hg38:
  description: "Human GRCh38 + GENCODE v45 + CIS-BP 2.00 (default) / HOCOMOCO v11"
  files:
    fasta:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/GRCh38.primary_assembly.genome.fa.gz
      target: hg38/genome.fa
      gunzip: true
      approx_size_mb: 3000
      build_fai: true
    gtf:
      url:    https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_45/gencode.v45.annotation.gtf.gz
      target: hg38/genes.gtf
      gunzip: true
      approx_size_mb: 1500
    motif_cisbp:
      url:    https://meme-suite.org/meme/meme-software/Databases/motifs/motif_databases.12.26.tgz
      target: hg38/cisBP_human.meme
      extract_from_tar: motif_databases/CIS-BP_2.00/Homo_sapiens.meme
      gunzip: false
      approx_size_mb: 5
    motif_hocomoco:
      url:    https://hocomoco11.autosome.org/final_bundle/hocomoco11/full/HUMAN/mono/HOCOMOCOv11_full_HUMAN_mono_meme_format.meme
      target: hg38/HOCOMOCOv11_human.meme
      gunzip: false
      approx_size_mb: 0.7

