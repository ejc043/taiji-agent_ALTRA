# DEPRECATED — kept as a back-compat alias for "install everything"
#
# As of 2026-04-26 the env is split into composable profiles:
#
#   environment.base.yml   bulk-only Python skills + MACS3 (~500 MB, ~5 min)
#   environment.sc.yml     adds R + Seurat/Signac for pseudobulk-construct (+3-4 GB)
#   environment.dev.yml    pytest/ruff/mypy/ipython (+500 MB)
#
# Install via:
#
#   bash bin/install.sh --system <os>                     # base only (default)
#   bash bin/install.sh --system <os> --profile sc        # base + sc
#   bash bin/install.sh --system <os> --profile full      # base + sc + dev
#
#   bash bin/auto-install.sh --data-dir <path>            # detects bulk/SC, picks profile
#
# This file now equals base + sc + dev for users / scripts that still call
# `conda env create -f environment.yml` directly. New users should switch to
# bin/install.sh which handles profile composition + post-install steps
# (MuDataSeurat + Taiji binary).

name: taiji-agent
channels:
  - conda-forge
  - bioconda

dependencies:
  # ---- Base profile ----
  - python=3.11
  - pip>=24.0
  - click>=8.1
  - pydantic>=2.5
  - pyyaml>=6.0
  - jinja2>=3.1
  - rich>=13.7
  - pandas>=2.0
  - openpyxl>=3.1
  - macs3>=3.0

  # ---- SC profile ----
  - r-base>=4.3
  - r-seurat>=5.0
  - bioconductor-signac>=1.12
  - r-matrix
  - bioconductor-genomicranges
  - r-dplyr
  - r-optparse
  - r-jsonlite
  - r-remotes

  # ---- Dev profile ----
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4
  - mypy>=1.8

  - pip:
      - -e .
