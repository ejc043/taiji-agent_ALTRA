# taiji-agent — single-source-of-truth conda env.
#
# Covers everything the three skills (detect-dataset-type, build-taiji-input,
# pseudobulk-construct) need at runtime. The Taiji binary itself is NOT in
# here — install it once via `bash bin/install-taiji.sh --system <centos|ubuntu|macos>`
# (it's a self-contained executable from the Taiji-pipeline GitHub releases).
# Two R packages (SeuratDisk, MuDataSeurat) are GitHub-only and are pulled
# in by `bin/postinstall.R` after `conda env create` finishes.
#
# Resolver hint: --strict-channel-priority is recommended because the
# pinned MACS3 + Bioconductor versions only resolve cleanly when bioconda
# wins ties over conda-forge.
#
# To create:   micromamba create -n taiji-agent -f environment.yml
# To update:   micromamba install  -n taiji-agent -f environment.yml
# Lockfile:    conda-lock --file environment.yml --platform linux-64

name: taiji-agent
channels:
  - conda-forge
  - bioconda

dependencies:
  # ---- Python interpreter + std deps ----
  - python=3.11
  - pip>=24.0

  # ---- Python packages used by the taiji-agent CLI scaffold + skills ----
  - click>=8.1
  - pydantic>=2.5
  - pyyaml>=6.0
  - jinja2>=3.1
  - rich>=13.7
  - pandas>=2.0           # build-taiji-input xlsx I/O
  - openpyxl>=3.1         # build-taiji-input xlsx writer

  # ---- Dev tools (kept in the same env to keep the install path simple) ----
  - pytest>=7.4
  - pytest-cov>=4.1
  - ruff>=0.4
  - mypy>=1.8

  # ---- R interpreter + Seurat / Signac stack (pseudobulk-construct) ----
  - r-base>=4.3
  - r-seurat>=5.0
  - bioconductor-signac>=1.12
  - r-matrix
  - bioconductor-genomicranges
  - r-dplyr
  - r-optparse
  - r-jsonlite
  - r-remotes               # required by bin/postinstall.R for the GitHub-only packages

  # ---- Peak caller. MACS3 ships via the Signac install path the user
  #      confirmed; pin it here to make the install deterministic instead of
  #      relying on transitive resolution.
  - macs3>=3.0

  # ---- pip-only packages (none currently; placeholder for future) ----
  - pip:
      - -e .

# ---- Notes ----
# * samtools, BWA, Picard, STAR, RSEM intentionally NOT included. All inputs
#   to the agent are pre-aligned/pre-quantified, so Taiji has no occasion
#   to invoke them. Add them back here if a future workflow needs alignment.
# * The lockfile (conda-lock.linux-64.yml) — when present — pins every
#   transitive package + version + hash for byte-reproducible installs.
#   Generate it with `conda-lock --file environment.yml --platform linux-64`
#   and commit the result.
