# Taiji per-sample config — hg38, pre-quantified bulk inputs (no alignment).
# Same as the HOCOMOCOv11 template but uses cisBP_human.meme to match the
# motif file used by the reference Nextflow run we are reproducing.

input: "[insert_input_filepath_here]"
output_dir: "[insert_output_directory_here]"
genome: "[insert_genome_filepath_here]"

annotation: "${REPO_ROOT}/dependencies_data/hg38/genes.gtf"
motif_file: "${REPO_ROOT}/dependencies_data/hg38/cisBP_human.meme"

tmp_dir: "${REPO_ROOT}/tmp"

resource:
    ATAC_Find_TFBS_Union:
        memory: 10
    ATAC_Get_TFBS:
        memory: 10
