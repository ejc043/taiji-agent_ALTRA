# Taiji 1.3.0 per-sample formula config (CHEM280 WI26 — RA vs OA chr22 demo).
#
# This file is a TEMPLATE. The taiji-runner skill materializes it ONCE PER
# SAMPLE, substituting three placeholders (input filepath, output directory,
# genome filepath) with sample-specific paths. See the SKILL.md for the
# substitution mapping. Same three-placeholder convention as the existing
# UCSD wrapper at Taiji/taiji_wrapper-uniqueGen.py — drop-in compatible.
#
# Field schema notes:
#   - tmp_dir (NOT temp_dir) is what Taiji 1.3.0 actually reads
#   - genome:, annotation:, motif_file: are required for the regulatory step
#   - picard: required for any BAM-stage processing; commented out here
#     because all inputs are pre-aligned/pre-quantified (TSV / narrowPeak /
#     bedpe). Uncomment + set the path if you ever feed raw FASTQs.
#   - bwa_index, star_index, rsem_index: only needed for de-novo alignment
#     paths; commented out for the same reason.
#   - resource: per-stage memory limits (mostly a SLURM concern; harmless
#     on local Mac runs)

# --- Per-sample inputs/outputs (substituted by taiji-runner) --------------
input:      [insert_input_filepath_here]
output_dir: [insert_output_directory_here]
genome:     [insert_genome_filepath_here]

# --- Scratch space ---
# Kept INSIDE the workspace so all Taiji writes are workspace-bounded
# (sandbox-run.sh enforces this). For whole-genome runs you may want >50 GB
# free under <repo>/tmp/; otherwise switch to a scratch path explicitly.
tmp_dir: ${REPO_ROOT}/tmp/RA_OA_chr22_demo

# --- Single-value reference data (shared across samples) ------------------
annotation: ${REPO_ROOT}/dependencies_data/hg38/genes.gtf
motif_file: ${REPO_ROOT}/dependencies_data/hg38/HOCOMOCOv11_human.meme

# --- Picard (required only when inputs include BAMs) ----------------------
# picard: /Users/eunicechoi/path/to/picard.jar

# --- Optional alignment indexes (NOT used for pre-aligned inputs) --------
# bwa_index:    ${REPO_ROOT}/dependencies_data/hg38/bwa_index
# bwa_seed_length: 32
# star_index:   ${REPO_ROOT}/dependencies_data/hg38/star_index
# rsem_index:   ${REPO_ROOT}/dependencies_data/hg38/rsem_index

# --- Per-stage resource hints (SLURM-only; harmless on local) ------------
# Mirrors the resource block from your existing UCSD formula. Tune as needed.
resource:
    ATAC_Align:
        memory: 40
    RNA_Align:
        memory: 40
    RNA_Make_Expr_Table:
        memory: 25
    ATAC_Find_TFBS_Union:
        memory: 10
    ATAC_Get_TFBS:
        memory: 10
