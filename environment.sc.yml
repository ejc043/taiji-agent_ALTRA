# taiji-agent — SC (single-cell) profile.
#
# Layers on top of environment.base.yml. Adds the R + Seurat/Signac stack
# needed by pseudobulk-construct (the only SC-using skill).
#
# Install order:
#   1. environment.base.yml      (required first)
#   2. environment.sc.yml        (this file; layers R packages)
#
# Disk: +3-4 GB on top of base.  Solve time on conda: +15-30 min (R + Bioconductor
# have a deep dependency graph).

name: taiji-agent
channels:
  - conda-forge
  - bioconda

dependencies:
  # ---- R interpreter ----
  - r-base>=4.3

  # ---- Seurat / Signac stack (pseudobulk-construct) ----
  - r-seurat>=5.0
  - r-signac>=1.12      # bioconda package name is `r-signac`, NOT `bioconductor-signac`

  # ---- Supporting R packages ----
  - r-matrix
  - bioconductor-genomicranges
  - r-dplyr
  - r-optparse
  - r-jsonlite

  # ---- EnsDb annotations for Signac::GeneActivity (coembed-construct) ----
  # GeneActivity needs gene-body + 2kb-upstream coords; Signac's vignette
  # uses these EnsDb releases. Pinned so reproducibility doesn't drift if
  # newer EnsDb releases land on bioconda.
  - bioconductor-ensdb.hsapiens.v86      # human (hg38, hg19)
  - bioconductor-ensdb.mmusculus.v79     # mouse (mm10)

